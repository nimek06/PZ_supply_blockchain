[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Explicit EVM target (V2-13). Cancun is supported by Anvil and Polygon Amoy;
# fall back to "shanghai" if a target network rejects the bytecode.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# completeStage has a fixed 9-argument ABI (changes-v2); legacy codegen runs out of stack.
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read", path = "../shared/fixtures" },
    { access = "read-write", path = "../shared/deployments" },
]

[fuzz]
runs = 512

[fmt]
line_length = 100

[lint]
# Deadlines are part of the protocol (block.timestamp is intended); the only "external call"
# before events is the ecrecover precompile, so reentrancy-events is a false positive.
exclude_lints = ["block-timestamp", "reentrancy-events"]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
amoy = "${AMOY_RPC_URL}"
