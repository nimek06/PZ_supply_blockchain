openapi: 3.1.0
# Dialekt JSON Schema: 2020-12 (wbudowany w OpenAPI 3.1) - taki sam jak w telemetry.schema.json.
# STATUS: SZKIC T002 (tydzień 1) do przeglądu osoby 2. Źródło: docs/protocol.md,
# docs/data-model.md, docs/access-control.md, docs/quality-approval.md, docs/changes-v2.md.
# Elementy oznaczone "PROPOZYCJA" nie wynikają wprost z protokołu i wymagają potwierdzenia.
info:
  title: PZ Supply Blockchain API
  version: 0.1.0-draft
  description: |
    Backend śledzenia produkcji. Zmiany stanu są poleceniami asynchronicznymi:
    `202` oznacza przyjęcie polecenia, a nie ukończony etap. Etap jest ukończony
    dopiero po kanonicznym zdarzeniu `StageCompleted` (patrz `CommandStatus.status`).

    Uwierzytelnienie: SIWE (EIP-4361) tylko do wydania tokenu Bearer. Brak cookie i CSRF.
    Błędy: `application/problem+json` (RFC 9457) ze stabilnym polem `code`.

    Liczby: znaczniki czasu (`deadline`, `approvalDeadline`) to Unix seconds jako liczba całkowita.
    Wartości uint256 większe niż 2^53 przenoś jako string dziesiętny.
servers:
  - url: http://localhost:8080
    description: Lokalnie (backend uruchomiony poza Compose)

tags:
  - name: auth
  - name: batches
  - name: stages
  - name: commands
  - name: qa
  - name: certificates

security:
  - bearerAuth: []

paths:
  /api/v1/auth/challenges:
    post:
      tags: [auth]
      operationId: createAuthChallenge
      summary: Wiadomość SIWE do podpisania (challenge jednorazowy, ważny 5 minut)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '200':
          description: Pełna wiadomość SIWE do podpisu (EIP-191). Domenę i URI wybiera backend z konfiguracji.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/auth/sessions:
    post:
      tags: [auth]
      operationId: createAuthSession
      summary: Podpisany challenge -> token Bearer
      description: Zużycie challenge i wydanie tokenu są atomowe. Token jest zwracany raz; w bazie tylko jego SHA-256.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionRequest'
      responses:
        '200':
          description: Token Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Challenge już zużyty albo wygasły (kod `CHALLENGE_USED_OR_EXPIRED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/auth/sessions/current:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: Kontekst bieżącej sesji (PROPOZYCJA - docs/access-control.md wymaga ujęcia go w tym schemacie)
      description: Adres, aktualne role (odczyt z łańcucha) i wygaśnięcie. Frontend używa tego do wykrycia zmiany konta w portfelu.
      responses:
        '200':
          description: Sesja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [auth]
      operationId: deleteCurrentSession
      summary: Wylogowanie (unieważnia token w bazie)
      responses:
        '204':
          description: Token unieważniony
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/batches:
    post:
      tags: [batches]
      operationId: createBatch
      summary: Utworzenie partii (OPERATOR_ROLE)
      description: |
        Numer partii `B-RRRR-NNNN` nadaje backend. Idempotencja: nagłówek `Idempotency-Key`
        w zakresie użytkownika i skrótu treści żądania.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '202':
          description: Polecenie CREATE_BATCH przyjęte
          headers:
            Location: { $ref: '#/components/headers/CommandLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ten sam `Idempotency-Key` z inną treścią (kod `IDEMPOTENCY_CONFLICT`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/batches/{batchId}:
    get:
      tags: [batches]
      operationId: getBatch
      summary: Projekcja partii (publiczna)
      security: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Partia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/batch-numbers/{batchNumber}:
    get:
      tags: [batches]
      operationId: getBatchByNumber
      summary: To samo co `getBatch`, po numerze `B-RRRR-NNNN` (QR, ręczne wpisanie)
      security: []
      parameters:
        - name: batchNumber
          in: path
          required: true
          schema: { $ref: '#/components/schemas/BatchNumber' }
      responses:
        '200':
          description: Partia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/batches/{batchId}/history:
    get:
      tags: [batches]
      operationId: getBatchHistory
      summary: Historia potwierdzonych etapów - ukończonych i odrzuconych (publiczna)
      description: |
        Stabilne sortowanie rosnąco po `(blockNumber, txIndex, logIndex)`. Zawiera wyłącznie
        zdarzenia z łańcucha; niepotwierdzone polecenia nie są mieszane z ukończonymi etapami.
        Po reorganizacji stary kursor może zwrócić `400` z kodem `CURSOR_STALE`.
      security: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Nieprzezroczysty kursor z poprzedniej odpowiedzi
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Strona historii
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/batches/{batchId}/stages:
    post:
      tags: [stages]
      operationId: submitStage
      summary: Podpisany raport stacji
      description: |
        Uwierzytelnienie samym podpisem raportu (owner pochodzi z recover). Token Bearer jest
        opcjonalny; jeśli jest obecny, musi odpowiadać signerowi. Zwraca `202` także dla
        `qaPassed=false` (wtedy `outcome=REJECTED` po potwierdzeniu `StageRejected`).
        Identyczny POST (ten sam digest) zwraca istniejące `commandId`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageSubmissionRequest' }
      responses:
        '202':
          description: Polecenie STAGE przyjęte (nowe albo istniejące o tym samym digeście)
          headers:
            Location: { $ref: '#/components/headers/CommandLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandAccepted' }
        '400':
          description: Niepoprawny format, schemat lub niespójne pola (batchId ścieżki != raportu itp.)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Zły podpis, stacja nieaktywna/wygasła/poza `stageMask`, niezgodność z certyfikatem lub rejestrem
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Konflikt etapu (`STAGE_ALREADY_PENDING`, `STAGE_ALREADY_COMPLETED`, `UNEXPECTED_STAGE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Za duże żądanie
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Raport niespójny z profilem pomiarów albo poza dozwoloną regułą (`PROFILE_VIOLATION`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/commands/{commandId}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: Status polecenia (właściciel lub Admin)
      description: |
        Cudzy `commandId` zwraca `404`, nie `403` - nie ujawniamy istnienia polecenia
        (wybór wymagany przez docs/access-control.md).
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/qa/candidates:
    get:
      tags: [qa]
      operationId: listQaCandidates
      summary: Kandydaci WAITING_FOR_QA (QA_INSPECTOR_ROLE lub Admin)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Lista kandydatów
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QaCandidatePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/qa/candidates/{commandId}:
    get:
      tags: [qa]
      operationId: getQaCandidate
      summary: Szczegóły kandydata (bez podpisów stacji, signed tx i tokenów)
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Kandydat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QaCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/qa/candidates/{commandId}/approval:
    post:
      tags: [qa]
      operationId: submitQaApproval
      summary: Podpis `StageApproval` operatora zmiany (bez transakcji, bez gazu)
      description: |
        Backend odzyskuje adres z podpisu i wymaga: zgodności z sesją, aktualnej QA_INSPECTOR_ROLE
        (odczyt z łańcucha), adresu różnego od stacji, niewygasłego `approvalDeadline`.
        Ten sam operator ponawiający - idempotentnie `200`; inny operator przy ważnym approval - `409`.
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaApprovalRequest' }
      responses:
        '200':
          description: Approval zapisane (lub idempotentne powtórzenie); polecenie przechodzi do READY_TO_SUBMIT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Zły podpis, brak QA_INSPECTOR_ROLE, adres operatora = adres stacji albo niezgodny z sesją
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Inny operator ma już ważne approval, albo polecenie nie jest w WAITING_FOR_QA (`APPROVAL_CONFLICT`, `NOT_WAITING_FOR_QA`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: Kandydat wygasł (deadline minął, polecenie FAILED) - `CANDIDATE_EXPIRED`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/station-certificates:
    post:
      tags: [certificates]
      operationId: registerStationCertificate
      summary: PROPOZYCJA - rejestracja certyfikatu stacji (Admin)
      description: |
        PROPOZYCJA do potwierdzenia na spotkaniu startowym. docs/protocol.md wymaga, by
        `stationCertificateId` wskazywał uprzednio zarejestrowany i zweryfikowany certyfikat,
        ale nie definiuje endpointu rejestracji. Backend weryfikuje wystawcę (allowlista), ważność,
        unikalność serialu i zgodność z rejestrem on-chain. Rejestracja identycznego poświadczenia
        jest idempotentna; ten sam `certificateId` z innym payloadem to `409 CERTIFICATE_CONFLICT`.
        Wystawianie certyfikatów to narzędzie administracyjne (CLI), nie ten endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationCertificateEnvelope' }
      responses:
        '201':
          description: Zarejestrowano (stan PENDING_ACTIVATION do potwierdzenia `StationRegistered`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationCertificateStatus' }
        '200':
          description: Identyczne poświadczenie było już zarejestrowane
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationCertificateStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Konflikt (`CERTIFICATE_CONFLICT`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/station-certificates/{certificateId}:
    get:
      tags: [certificates]
      operationId: getStationCertificate
      summary: PROPOZYCJA - stan certyfikatu stacji (Admin lub stacja-właściciel)
      description: Poświadczenie nie jest publiczne (może zawierać metadane zakładu).
      parameters:
        - name: certificateId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Bytes32' }
      responses:
        '200':
          description: Stan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationCertificateStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque token z `POST /auth/sessions`. Trzymany w pamięci klienta, nie w localStorage.

  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      description: '`keccak256(utf8(batchNumber))`'
      schema: { $ref: '#/components/schemas/Bytes32' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  headers:
    CommandLocation:
      description: Adres odczytu statusu polecenia
      schema: { type: string }

  responses:
    BadRequest:
      description: Niepoprawny format, schemat lub niespójne pola
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Brak lub nieważny token (`UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Brak prawa lub zły dowód (`FORBIDDEN` i kody szczegółowe)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Nieznany zasób (dla cudzego polecenia również)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limit żądań (`RATE_LIMITED`)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Zależność niedostępna lub nie można trwale przyjąć polecenia (`DEPENDENCY_UNAVAILABLE`) - nigdy fałszywy sukces
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ------------------------------------------------------------ typy podstawowe
    Bytes32:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
      description: bytes32 jako `0x` + 64 znaki hex
    Address:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
      description: Adres EVM. Porównuj jako bajty, nie jako tekst (wielkość liter nie ma znaczenia).
    Signature:
      type: string
      pattern: '^0x[0-9a-fA-F]{130}$'
      description: Podpis ECDSA 65 bajtów (r||s||v, v = 27/28) jako hex z `0x`
    BatchNumber:
      type: string
      pattern: '^B-[0-9]{4}-[0-9]{4}$'
      examples: ['B-2026-0001']
    StageId:
      type: integer
      minimum: 0
      maximum: 3
      description: '0 PREPARATION, 1 ASSEMBLY, 2 QUALITY_CONTROL, 3 PACKAGING'
    StageCode:
      type: string
      enum: [PREPARATION, ASSEMBLY, QUALITY_CONTROL, PACKAGING]
    UnixSeconds:
      type: integer
      minimum: 0
      description: Unix time w sekundach (nie milisekundach)
    Cid:
      type: string
      minLength: 1
      maxLength: 128
      description: CIDv0 lub CIDv1, bez URL bramki. Nie porównuj z `reportHash`.

    # ------------------------------------------------------------ błędy
    Problem:
      type: object
      description: RFC 9457 Problem Details. Bez szczegółów RPC, tokenów i stack trace.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, description: 'URI klasy błędu lub `about:blank`' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stabilny kod domenowy (PROPOZYCJA listy - do zatwierdzenia z osobą 2):
            INVALID_REQUEST, SCHEMA_VIOLATION, PROFILE_VIOLATION, UNAUTHENTICATED, FORBIDDEN,
            INVALID_SIGNATURE, SIGNER_MISMATCH, STATION_NOT_ACTIVE, STAGE_NOT_ALLOWED,
            CERTIFICATE_INVALID, REGISTRY_MISMATCH, ROLE_MISSING, NOT_FOUND, UNEXPECTED_STAGE,
            STAGE_ALREADY_PENDING, STAGE_ALREADY_COMPLETED, DEADLINE_EXPIRED, DEADLINE_TOO_FAR,
            APPROVAL_CONFLICT, NOT_WAITING_FOR_QA, CANDIDATE_EXPIRED, SAME_STATION_AND_OPERATOR,
            IDEMPOTENCY_CONFLICT, CERTIFICATE_CONFLICT, CHALLENGE_USED_OR_EXPIRED, CURSOR_STALE,
            PAYLOAD_TOO_LARGE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE
        correlationId: { type: string }
        retryAllowedAfter:
          allOf: [{ $ref: '#/components/schemas/UnixSeconds' }]
          description: Przy `STAGE_ALREADY_PENDING` po FAILED - kiedy nowy raport będzie dozwolony

    # ------------------------------------------------------------ auth
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { $ref: '#/components/schemas/Address' }
    AuthChallenge:
      type: object
      required: [challengeId, message, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        message: { type: string, description: 'Dokładna wiadomość SIWE (EIP-4361) do podpisu EIP-191' }
        expiresAt: { $ref: '#/components/schemas/UnixSeconds' }
    AuthSessionRequest:
      type: object
      additionalProperties: false
      required: [challengeId, message, signature]
      properties:
        challengeId: { type: string, format: uuid }
        message: { type: string }
        signature: { $ref: '#/components/schemas/Signature' }
    AuthSession:
      type: object
      required: [token, tokenType, address, expiresAt, idleTimeoutSeconds]
      properties:
        token: { type: string, description: Zwracany raz; co najmniej 256 bitów entropii }
        tokenType: { type: string, const: Bearer }
        address: { $ref: '#/components/schemas/Address' }
        expiresAt: { $ref: '#/components/schemas/UnixSeconds' }
        idleTimeoutSeconds: { type: integer, minimum: 1 }
    Role:
      type: string
      enum: [OPERATOR_ROLE, QA_INSPECTOR_ROLE, RELAYER_ROLE, DEFAULT_ADMIN_ROLE]
    SessionContext:
      type: object
      required: [address, roles, expiresAt, chainId, verifyingContract]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          uniqueItems: true
        expiresAt: { $ref: '#/components/schemas/UnixSeconds' }
        chainId: { type: integer }
        verifyingContract: { $ref: '#/components/schemas/Address' }

    # ------------------------------------------------------------ polecenia
    CreateBatchRequest:
      type: object
      additionalProperties: false
      description: Pusty obiekt jest dozwolony; numer partii nadaje backend.
      properties: {}
    CommandType:
      type: string
      enum: [CREATE_BATCH, STAGE]
    CommandState:
      type: string
      enum: [ACCEPTED, PINNING, WAITING_FOR_QA, READY_TO_SUBMIT, SUBMITTED, CONFIRMED, FAILED]
    Outcome:
      type: string
      enum: [ACCEPTED, REJECTED]
      description: Tylko dla `CONFIRMED`. ACCEPTED = `StageCompleted`, REJECTED = `StageRejected`.
    CommandAccepted:
      type: object
      required: [commandId, type, status, statusUrl]
      properties:
        commandId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/CommandType' }
        status: { $ref: '#/components/schemas/CommandState' }
        statusUrl: { type: string, description: 'np. /api/v1/commands/{commandId}' }
        batchNumber:
          allOf: [{ $ref: '#/components/schemas/BatchNumber' }]
          description: Dla CREATE_BATCH
        batchId:
          allOf: [{ $ref: '#/components/schemas/Bytes32' }]
          description: Dla CREATE_BATCH
    CommandStatus:
      type: object
      required: [commandId, type, status]
      properties:
        commandId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/CommandType' }
        status: { $ref: '#/components/schemas/CommandState' }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/Outcome'
            - type: 'null'
        batchId: { $ref: '#/components/schemas/Bytes32' }
        batchNumber: { $ref: '#/components/schemas/BatchNumber' }
        stageId: { $ref: '#/components/schemas/StageId' }
        reportHash: { $ref: '#/components/schemas/Bytes32' }
        cid:
          oneOf:
            - $ref: '#/components/schemas/Cid'
            - type: 'null'
        txHash:
          oneOf:
            - $ref: '#/components/schemas/Bytes32'
            - type: 'null'
          description: Dopiero po SUBMITTED. Nigdy fikcyjny.
        failureCode:
          type:
            - string
            - 'null'
        retryAt:
          oneOf:
            - $ref: '#/components/schemas/UnixSeconds'
            - type: 'null'
          description: Zaplanowane ponowienie tego samego raportu
        retryAllowedAfter:
          oneOf:
            - $ref: '#/components/schemas/UnixSeconds'
            - type: 'null'
          description: Po FAILED - od kiedy wolno wysłać nowy raport tego etapu
        deadline: { $ref: '#/components/schemas/UnixSeconds' }
        createdAt: { $ref: '#/components/schemas/UnixSeconds' }
        updatedAt: { $ref: '#/components/schemas/UnixSeconds' }

    # ------------------------------------------------------------ etapy
    StageSubmissionRequest:
      type: object
      additionalProperties: false
      required: [report, stationCertificateId, reportHash, deadline, signature]
      properties:
        report:
          $ref: 'telemetry.schema.json'
        stationCertificateId:
          allOf: [{ $ref: '#/components/schemas/Bytes32' }]
          description: Poza raportem objętym JCS. Backend wybiera zapisany, zweryfikowany certyfikat.
        reportHash:
          allOf: [{ $ref: '#/components/schemas/Bytes32' }]
          description: Keccak-256 bajtów JCS raportu (nie NIST SHA3-256)
        deadline: { $ref: '#/components/schemas/UnixSeconds' }
        signature:
          allOf: [{ $ref: '#/components/schemas/Signature' }]
          description: EIP-712 `StageCompletion` podpisany kluczem stacji

    # ------------------------------------------------------------ partie
    BatchResponse:
      type: object
      required: [batchId, batchNumber, completed, nextStage, projection]
      properties:
        batchId: { $ref: '#/components/schemas/Bytes32' }
        batchNumber: { $ref: '#/components/schemas/BatchNumber' }
        completed: { type: boolean }
        nextStage:
          description: Oczekiwany etap; `null` dla zakończonej partii (nie pokazuj wartości 4)
          oneOf:
            - $ref: '#/components/schemas/StageId'
            - type: 'null'
        projection:
          $ref: '#/components/schemas/ProjectionFreshness'
    ProjectionFreshness:
      type: object
      description: Aktualność projekcji - nie wolno oznaczać niezweryfikowanego stanu jako potwierdzonego.
      required: [lastIndexedBlock, requiredConfirmations]
      properties:
        lastIndexedBlock: { type: integer, minimum: 0 }
        requiredConfirmations: { type: integer, minimum: 0 }
        stale:
          type: boolean
          description: true, gdy indexer nie nadąża lub RPC jest niedostępne
    HistoryEntry:
      type: object
      required: [stageId, stageCode, outcome, reportHash, cid, station, txHash, blockNumber, logIndex, confirmations, confirmed]
      properties:
        stageId: { $ref: '#/components/schemas/StageId' }
        stageCode: { $ref: '#/components/schemas/StageCode' }
        outcome:
          type: string
          enum: [COMPLETED, REJECTED]
        reportHash: { $ref: '#/components/schemas/Bytes32' }
        cid: { $ref: '#/components/schemas/Cid' }
        station: { $ref: '#/components/schemas/Address' }
        qaOperator:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: '`null` (adres zerowy w zdarzeniu) dla etapów bez bramki i dla REJECTED'
        txHash: { $ref: '#/components/schemas/Bytes32' }
        blockNumber: { type: integer, minimum: 0 }
        txIndex: { type: integer, minimum: 0 }
        logIndex: { type: integer, minimum: 0 }
        confirmations: { type: integer, minimum: 0 }
        confirmed: { type: boolean, description: 'true po osiągnięciu wymaganej liczby potwierdzeń' }
    HistoryPage:
      type: object
      required: [items, nextCursor, projection]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        nextCursor:
          type:
            - string
            - 'null'
        projection:
          $ref: '#/components/schemas/ProjectionFreshness'

    # ------------------------------------------------------------ QA
    QaCandidate:
      type: object
      description: Dane potrzebne do decyzji. Bez podpisu stacji, signed tx, tokenów i diagnostyki relayera.
      required: [commandId, batchId, batchNumber, stageId, station, reportHash, cid, report, deadline, approvalDeadlineSuggested, domain]
      properties:
        commandId: { type: string, format: uuid }
        batchId: { $ref: '#/components/schemas/Bytes32' }
        batchNumber: { $ref: '#/components/schemas/BatchNumber' }
        stageId: { $ref: '#/components/schemas/StageId' }
        station: { $ref: '#/components/schemas/Address' }
        reportHash: { $ref: '#/components/schemas/Bytes32' }
        cid: { $ref: '#/components/schemas/Cid' }
        report:
          $ref: 'telemetry.schema.json'
        deadline: { $ref: '#/components/schemas/UnixSeconds' }
        approvalDeadlineSuggested:
          allOf: [{ $ref: '#/components/schemas/UnixSeconds' }]
          description: Domyślnie jak deadline stacji (DEC-11)
        domain:
          $ref: '#/components/schemas/Eip712Domain'
        approvalState:
          type: string
          enum: [NONE, APPROVED_BY_YOU, APPROVED_BY_OTHER]
    QaCandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QaCandidate' }
        nextCursor:
          type:
            - string
            - 'null'
    Eip712Domain:
      type: object
      description: Z konfiguracji sieci backendu - nigdy z danych klienta.
      required: [name, version, chainId, verifyingContract]
      properties:
        name: { type: string, const: SupplyChain }
        version: { type: string, const: '1' }
        chainId: { type: integer }
        verifyingContract: { $ref: '#/components/schemas/Address' }
    QaApprovalRequest:
      type: object
      additionalProperties: false
      required: [approvalDeadline, signature]
      properties:
        approvalDeadline: { $ref: '#/components/schemas/UnixSeconds' }
        signature:
          allOf: [{ $ref: '#/components/schemas/Signature' }]
          description: EIP-712 `StageApproval(batchId, stageId, reportHash, deadline=approvalDeadline)`

    # ------------------------------------------------------------ certyfikaty (PROPOZYCJA)
    StationCertificatePayload:
      type: object
      additionalProperties: false
      required: [schemaVersion, certificateId, stationId, stationAddress, issuerAddress, chainId, verifyingContract, issuedAt, expiresAt, allowedStageIds]
      properties:
        schemaVersion: { type: integer, const: 1 }
        certificateId: { $ref: '#/components/schemas/Bytes32' }
        stationId: { $ref: '#/components/schemas/Bytes32' }
        stationAddress: { $ref: '#/components/schemas/Address' }
        issuerAddress: { $ref: '#/components/schemas/Address' }
        chainId: { type: integer, minimum: 1 }
        verifyingContract: { $ref: '#/components/schemas/Address' }
        issuedAt: { $ref: '#/components/schemas/UnixSeconds' }
        expiresAt: { $ref: '#/components/schemas/UnixSeconds' }
        allowedStageIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/StageId' }
    StationCertificateEnvelope:
      type: object
      additionalProperties: false
      required: [payload, signature]
      properties:
        payload: { $ref: '#/components/schemas/StationCertificatePayload' }
        signature:
          allOf: [{ $ref: '#/components/schemas/Signature' }]
          description: 'EIP-712 `StationCertificate(bytes32 payloadHash)` wystawcy; payloadHash = Keccak-256(JCS(payload))'
    StationCertificateStatus:
      type: object
      required: [certificateId, stationAddress, status]
      properties:
        certificateId: { $ref: '#/components/schemas/Bytes32' }
        stationId: { $ref: '#/components/schemas/Bytes32' }
        stationAddress: { $ref: '#/components/schemas/Address' }
        status:
          type: string
          enum: [PENDING_ACTIVATION, ACTIVE, EXPIRED, REVOKED, BLOCKED, REGISTRY_MISMATCH]
        expiresAt: { $ref: '#/components/schemas/UnixSeconds' }
        allowedStageIds:
          type: array
          items: { $ref: '#/components/schemas/StageId' }
