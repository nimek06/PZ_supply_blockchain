scenarioVersion: 1
name: ebike-repeat-completed-stage
description: >-
  Po potwierdzeniu etapu 0 ponowne zgłoszenie tego samego etapu (nowy raport, inny
  digest) ma zostać odrzucone przez backend: `409 STAGE_ALREADY_COMPLETED`. To krok
  negatywny - nie czeka na potwierdzenie i nie przesuwa partii. Sprawdza, że
  ukończonego etapu nie da się powtórzyć przez API.
batchNumber: B-2026-0001
