  reference: ST-001
seed: 20261123
steps:
  - stageId: 0
    expect:
      httpStatus: 202
      nextStage: 1
  - stageId: 0
    expect:
      httpStatus: 409
      errorCode: STAGE_ALREADY_COMPLETED
